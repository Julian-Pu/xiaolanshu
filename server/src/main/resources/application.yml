# 小蓝书后端配置
server:
  port: 3000

spring:
  application:
    name: xiaolanshu-server
  datasource:
    # 开发默认：H2 文件库（MySQL 兼容模式），零配置。
    # 生产切换 MySQL：改 url/driver 并取消注释下方 mysql 配置，见 docs/05。
    url: jdbc:h2:file:./data/xiaolanshu;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
      # password:              # 生产有密码时填写
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# 业务配置
xiaolanshu:
  jwt:
    # 生产必须替换为 >= 32 字节的高熵随机串
    secret: change-me-to-a-long-random-secret-key-at-least-32-bytes
    expires-days: 7
  upload-dir: ./uploads
  web-dist: ../web/dist          # 网页端构建产物（存在时后端自动托管）
  image:
    thumb-max-side: 600          # 缩略图最长边像素
    watermark: true              # 缩略图右下角叠加「小蓝书」半透明水印
  audit:
    enabled: true                # 文本机审开关（命中敏感词拦截发布/编辑/评论）
  recommend:
    pool-size: 50                # 推荐离线物料池每用户候选数（每小时定时重建）
  rate-limit:
    max-per-minute: 300
  sms:
    # 短信验证码（开发模式，未接运营商短信通道）
    enabled: true              # 注册是否强制校验短信验证码；false 恢复纯密码注册
    debug: true                # 开发模式：验证码随接口响应返回 + 打印控制台日志；生产置 false（仅打印日志）
    ttl-minutes: 5             # 验证码有效期
    redis-enabled: true        # true 优先存 Redis（连不上自动降级内存并告警）；false 直接用内存

logging:
  level:
    root: info
