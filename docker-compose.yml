# 小蓝书生产栈参考编排（docs/05 对应配置）
# 用法：cd 仓库根目录 && docker compose up -d
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - server
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xiaolanshu?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: xls
      SPRING_DATASOURCE_PASSWORD: change-me
      XIAOLANSHU_JWT_SECRET: change-me-to-a-long-random-secret-key-at-least-32-bytes
      XIAOLANSHU_ADMIN_KEY: change-me-admin-key
      XIAOLANSHU_RATE_LIMIT_MAX_PER_MINUTE: "300"
      XIAOLANSHU_UPLOAD_DIR: /app/uploads
      XIAOLANSHU_WEB_DIST: /nonexistent
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: xiaolanshu
      MYSQL_USER: xls
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-me
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
